[experiment]
name = "akq_allin_cfr_plus"

[game]
id = "akq_allin"

[game.params]
oop_stack = 1.0
ip_stack = 1.0

[solver]
id = "cfr_plus"
backend = "native_efg"
algorithm = "cfr_plus"
iterations = 10000
snapshot_every = 1000
early_stopping = true
target_exploitability = 1e-5
min_iterations = 1000
patience_checkpoints = 2

[analysis]
mode = "exact_tree"
off_path_threshold = 1e-8

[output]
artifact_root = "artifacts"
