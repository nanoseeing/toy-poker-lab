[experiment]
name = "integer_range_betting_cfr_plus"

[game]
id = "integer_range_betting"

[game.params]
oop_stack = 4.0
ip_stack = 4.0
bet_fractions = "0.3333333333333333,1.0"

[solver]
id = "cfr_plus"
backend = "native_efg"
iterations = 100000
snapshot_every = 10000

[analysis]
mode = "exact_tree"
off_path_threshold = 1e-8
major_reach_threshold = 1e-4

[output]
artifact_root = "artifacts"
