[experiment]
name = "study_zero_one_n50_two_street_dcfr"

[game]
id = "integer_range_betting_two_street"

[game.params]
oop_stack = 4.0
ip_stack = 4.0
bet_fractions = "0.3333333333333333,1.0"
num_ranks = 50
oop_rank_weights = "uniform"
ip_rank_weights = "uniform"
oop_can_raise = true
ip_can_raise = true

[solver]
id = "cfr_plus"
backend = "cpp_range"
algorithm = "dcfr"
precision = "float64"
iterations = 10000
snapshot_every = 1000
early_stopping = true
target_exploitability = 1e-5
min_iterations = 1000
patience_checkpoints = 2

[analysis]
mode = "exact_tree"
off_path_threshold = 1e-8
major_reach_threshold = 1e-4
report_scope = "major_only"
policy_format = "npz"
interactive_viewer = true
viewer_grid_columns = 10

[output]
artifact_root = "artifacts"
