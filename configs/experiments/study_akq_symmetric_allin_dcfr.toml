[experiment]
name = "study_akq_symmetric_allin_dcfr"

[game]
id = "integer_range_betting"

[game.params]
oop_stack = 1.0
ip_stack = 1.0
bet_fractions = "1.0"
num_ranks = 3
oop_rank_weights = "uniform"
ip_rank_weights = "uniform"

[solver]
id = "cfr_plus"
backend = "cpp_range"
algorithm = "dcfr"
precision = "float64"
iterations = 10000
snapshot_every = 1000
early_stopping = true
target_exploitability = 1e-5
min_iterations = 1000
patience_checkpoints = 2

[analysis]
mode = "exact_tree"
off_path_threshold = 1e-8
major_reach_threshold = 1e-4
interactive_viewer = true
viewer_grid_columns = 3

[output]
artifact_root = "artifacts"
