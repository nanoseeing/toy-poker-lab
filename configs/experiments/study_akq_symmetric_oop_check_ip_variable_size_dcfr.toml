[experiment]
name = "study_akq_symmetric_oop_check_ip_variable_size_dcfr"

[game]
id = "integer_range_betting"

[game.params]
oop_stack = 1.0
ip_stack = 1.0
bet_fractions = "0.05,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5,0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.95"
num_ranks = 3
oop_rank_weights = "uniform"
ip_rank_weights = "uniform"
oop_can_raise = false
ip_can_raise = true

[solver]
id = "cfr_plus"
backend = "cpp_range"
algorithm = "dcfr"
precision = "float64"
iterations = 10000
snapshot_every = 1000
early_stopping = true
target_exploitability = 1e-5
min_iterations = 1000
patience_checkpoints = 2

[[solver.node_locks]]
player = "OOP"
rank = 1
history = "ROOT"
actions = { check = 1.0 }

[[solver.node_locks]]
player = "OOP"
rank = 2
history = "ROOT"
actions = { check = 1.0 }

[[solver.node_locks]]
player = "OOP"
rank = 3
history = "ROOT"
actions = { check = 1.0 }

[analysis]
mode = "exact_tree"
off_path_threshold = 1e-8
major_reach_threshold = 1e-4
interactive_viewer = true
viewer_grid_columns = 3

[output]
artifact_root = "artifacts"
