[experiment]
name = "study_akqj_two_street_variable_size_dcfr"

[game]
id = "integer_range_betting_two_street"

[game.params]
oop_stack = 4.0
ip_stack = 4.0
bet_fractions = "0.25,0.5,0.75,1.0,1.25,1.5"
num_ranks = 4
oop_rank_weights = "0,0,1,0"
ip_rank_weights = "1,1,0,1"
oop_can_raise = true
ip_can_raise = true

[solver]
id = "cfr_plus"
backend = "cpp_range"
algorithm = "dcfr"
precision = "float64"
iterations = 10000
snapshot_every = 1000
early_stopping = true
target_exploitability = 1e-5
min_iterations = 1000
patience_checkpoints = 2

[analysis]
mode = "exact_tree"
off_path_threshold = 1e-8
major_reach_threshold = 1e-4
report_scope = "major_only"
policy_format = "npz"
interactive_viewer = true
viewer_grid_columns = 4

[output]
artifact_root = "artifacts"
