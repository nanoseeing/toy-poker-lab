[experiment]
name = "akqj_two_street_stack_4_cfr_plus"

[game]
id = "akqj_two_street"

[game.params]
oop_stack = 4.0
ip_stack = 4.0

[solver]
id = "cfr_plus"
backend = "native_efg"
algorithm = "cfr_plus"
iterations = 10000
snapshot_every = 1000
early_stopping = true
target_exploitability = 1e-5
min_iterations = 1000
patience_checkpoints = 2

[analysis]
mode = "exact_tree"
off_path_threshold = 1e-8
major_reach_threshold = 1e-4

[output]
artifact_root = "artifacts"
