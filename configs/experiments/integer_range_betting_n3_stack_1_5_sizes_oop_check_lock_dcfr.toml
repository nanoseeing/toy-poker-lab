[experiment]
name = "integer_range_betting_n3_stack_1_5_sizes_oop_check_lock_dcfr"

[game]
id = "integer_range_betting"

[game.params]
oop_stack = 1.0
ip_stack = 1.0
bet_fractions = "0.1,0.2,0.3333333333333333,0.5,0.75"
num_ranks = 3
oop_rank_weights = "uniform"
ip_rank_weights = "uniform"

[solver]
id = "cfr_plus"
backend = "cpp_range"
algorithm = "dcfr"
dcfr_alpha = 1.5
dcfr_beta = 0.0
dcfr_gamma = 2.0
precision = "float64"
iterations = 10000
snapshot_every = 1000
early_stopping = true
target_exploitability = 1e-5
min_iterations = 1000
patience_checkpoints = 2

[[solver.node_locks]]
player = "OOP"
rank = 1
history = "ROOT"
actions = { check = 1.0 }

[[solver.node_locks]]
player = "OOP"
rank = 2
history = "ROOT"
actions = { check = 1.0 }

[[solver.node_locks]]
player = "OOP"
rank = 3
history = "ROOT"
actions = { check = 1.0 }

[analysis]
mode = "exact_tree"
off_path_threshold = 1e-8
major_reach_threshold = 1e-4
interactive_viewer = true
viewer_grid_columns = 3

[output]
artifact_root = "artifacts"
